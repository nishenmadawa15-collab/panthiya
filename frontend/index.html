<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Panthiya — an AI assistant for Sri Lankan tuition classes.">
<meta name="theme-color" content="#FBF7EE">
<title>Panthiya · පන්තිය</title>
<link rel="stylesheet" href="/assets/styles.css">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<script type="module" src="/assets/app.js"></script>
</head>
<body>

<a class="skip" href="#main" data-i18n="skip.link"></a>

<noscript>
  <p class="noscript">Panthiya needs JavaScript to switch languages. An AI assistant for Sri
  Lankan tuition classes: attendance, fees and marks by voice or chat, with rules it never breaks.</p>
</noscript>

<header class="masthead">
  <div class="brand">
    <span class="brand__mark" aria-hidden="true">ප</span>
    <div class="brand__text">
      <h1 class="brand__name" data-i18n="app.name"></h1>
      <p class="brand__tagline" data-i18n="app.tagline"></p>
    </div>
  </div>

  <nav class="langs">
    <span class="langs__label" id="lang-label" data-i18n="lang.label"></span>
    <div class="langs__group" role="group" aria-labelledby="lang-label">
      <button type="button" class="lang" data-lang="si" lang="si" data-i18n="lang.si"></button>
      <button type="button" class="lang" data-lang="ta" lang="ta" data-i18n="lang.ta"></button>
      <button type="button" class="lang" data-lang="en" lang="en" data-i18n="lang.en"></button>
    </div>
  </nav>
</header>

<main id="main">

  <section class="sheet hero" aria-labelledby="hero-greeting">
    <h2 class="hero__greeting" id="hero-greeting" data-i18n="hero.greeting"></h2>
    <p class="hero__body" data-i18n="hero.body"></p>
  </section>

  <!-- ---------- sign-in entry ----------
       Three links rather than a sign-in button, and the reason is requirement 1.1: the ID token
       lives in the page's memory, so it does not survive a navigation. Signing in here would
       have to be done again on arrival, so each role page signs in for itself and this page
       holds no token at all. The second sign-in is silent — Cognito's own session answers it. -->
  <section class="auth-entry block" aria-labelledby="auth-entry-heading">
    <h2 class="block__heading" id="auth-entry-heading" data-i18n="auth.heading"></h2>
    <p class="auth-entry__note" data-i18n="auth.entry.note"></p>
    <ul class="auth-entry__list">
      <li class="auth-entry__item">
        <a class="footer__link auth-entry__link" href="/teacher/" data-i18n="roles.teacher.title"></a>
      </li>
      <li class="auth-entry__item">
        <a class="footer__link auth-entry__link" href="/parent/" data-i18n="roles.parent.title"></a>
      </li>
      <li class="auth-entry__item">
        <a class="footer__link auth-entry__link" href="/student/" data-i18n="roles.student.title"></a>
      </li>
    </ul>
    <p class="auth-entry__small" data-i18n="auth.memory_note"></p>
  </section>

  <section class="block" aria-labelledby="roles-heading">
    <h2 class="block__heading" id="roles-heading" data-i18n="roles.heading"></h2>
    <ul class="cards">
      <li class="card">
        <h3 class="card__title" data-i18n="roles.teacher.title"></h3>
        <p class="card__body" data-i18n="roles.teacher.body"></p>
      </li>
      <li class="card">
        <h3 class="card__title" data-i18n="roles.parent.title"></h3>
        <p class="card__body" data-i18n="roles.parent.body"></p>
      </li>
      <li class="card">
        <h3 class="card__title" data-i18n="roles.student.title"></h3>
        <p class="card__body" data-i18n="roles.student.body"></p>
      </li>
    </ul>
  </section>

  <section class="block" aria-labelledby="rules-heading">
    <h2 class="block__heading" id="rules-heading" data-i18n="rules.heading"></h2>
    <ul class="rules">
      <li class="rules__item" data-i18n="rules.item1"></li>
      <li class="rules__item" data-i18n="rules.item2"></li>
      <li class="rules__item" data-i18n="rules.item3"></li>
      <li class="rules__item" data-i18n="rules.item4"></li>
      <li class="rules__item" data-i18n="rules.item5"></li>
    </ul>
    <p class="rules__note" data-i18n="rules.note"></p>
  </section>

  <section class="block" aria-labelledby="stamps-heading">
    <h2 class="block__heading" id="stamps-heading" data-i18n="stamps.heading"></h2>
    <p class="stamps">
      <span class="stamp stamp--paid" data-i18n="stamps.paid"></span>
      <span class="stamp stamp--absent" data-i18n="stamps.absent"></span>
      <span class="stamp stamp--draft" data-i18n="stamps.draft"></span>
    </p>
  </section>

  <section class="block" aria-labelledby="status-heading">
    <h2 class="block__heading" id="status-heading" data-i18n="status.heading"></h2>
    <dl class="status">
      <dt class="status__term" data-i18n="status.milestone"></dt>
      <dd class="status__value"><span class="dot" aria-hidden="true"></span><span data-i18n="status.now"></span></dd>
      <dd class="status__next" data-i18n="status.next"></dd>
    </dl>
  </section>

</main>

<footer class="footer">
  <p class="footer__line" data-i18n="footer.built_by"></p>
  <p class="footer__line footer__author" data-i18n="footer.author"></p>
  <p class="footer__line footer__small" data-i18n="footer.demo_data"></p>
  <p class="footer__line footer__small">
    <a class="footer__link" href="https://github.com/nishenmadawa15-collab/panthiya" data-i18n="footer.repo"></a>
    <span aria-hidden="true"> · </span>
    <span data-i18n="footer.license"></span>
  </p>
</footer>

</body>
</html>
