<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Panthiya — the teacher screen: chat, and the fee ledger for this month.">
<meta name="theme-color" content="#FBF7EE">
<title>Panthiya · පන්තිය</title>
<link rel="stylesheet" href="/assets/styles.css">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<script type="module" src="/assets/auth.js"></script>
<script type="module" src="/assets/teacher.js"></script>
</head>
<body>

<a class="skip" href="#main" data-i18n="skip.link"></a>

<noscript>
  <p class="noscript">Panthiya needs JavaScript to switch languages and to show this class. An AI
  assistant for Sri Lankan tuition classes: attendance, fees and marks by voice or chat.</p>
</noscript>

<header class="masthead">
  <div class="brand">
    <span class="brand__mark" aria-hidden="true">ප</span>
    <div class="brand__text">
      <h1 class="brand__name" data-i18n="app.name"></h1>
      <p class="brand__tagline" data-i18n="app.tagline"></p>
    </div>
  </div>

  <nav class="langs">
    <span class="langs__label" id="lang-label" data-i18n="lang.label"></span>
    <div class="langs__group" role="group" aria-labelledby="lang-label">
      <button type="button" class="lang" data-lang="si" lang="si" data-i18n="lang.si"></button>
      <button type="button" class="lang" data-lang="ta" lang="ta" data-i18n="lang.ta"></button>
      <button type="button" class="lang" data-lang="en" lang="en" data-i18n="lang.en"></button>
    </div>
  </nav>
</header>

<main id="main">

  <p class="crumbs">
    <a class="footer__link crumbs__link" href="/" data-i18n="nav.home"></a>
  </p>

  <!-- ---------- sign-in (requirement 1.1) ----------
       The ID token this panel obtains lives in auth.js's memory and nowhere else: no
       localStorage, no sessionStorage, no cookie, nothing that survives a reload. Signing in
       again after a reload is the price, and after the first time it is a silent redirect.

       `data-auth-role` is what this page is *for*, and the panel compares it with the token's
       own role only to decide whether to say "wrong account". The role that decides anything is
       the one the server reads from the verified token (requirement 1.3) — this page never sends
       a role, in any field. -->
  <section class="auth-panel" id="auth" data-auth-role="teacher" aria-labelledby="auth-heading">
    <h2 class="vh" id="auth-heading" data-i18n="auth.heading"></h2>
    <p class="auth-panel__state" id="auth-state" role="status"></p>
    <p class="auth-panel__actions">
      <button type="button" class="composer__send" id="auth-signin" data-i18n="auth.signin" hidden></button>
      <button type="button" class="composer__mic" id="auth-signout" data-i18n="auth.signout" hidden></button>
    </p>
    <p class="auth-panel__note" data-i18n="auth.memory_note"></p>
  </section>

  <section class="sheet" aria-labelledby="teacher-heading">
    <h2 class="hero__greeting" id="teacher-heading" data-i18n="teacher.heading"></h2>
    <p class="hero__body" data-i18n="teacher.note"></p>
  </section>

  <!-- ---------- chat ---------- -->
  <section class="block" aria-labelledby="chat-heading">
    <h3 class="block__heading" id="chat-heading" data-i18n="chat.heading"></h3>

    <!-- role="log" + aria-live: a new reply is announced without stealing focus.
         tabindex="0" so the history can be scrolled from the keyboard (requirement 12.4). -->
    <div class="sheet chat__log" id="chat-log" role="log" aria-live="polite"
         aria-labelledby="chat-heading" tabindex="0">

      <div class="chat__empty" id="chat-empty">
        <p class="chat__empty-heading" data-i18n="chat.empty_heading"></p>
        <ul class="chat__examples">
          <li class="chat__example" data-i18n="chat.example.fee"></li>
          <li class="chat__example" data-i18n="chat.example.attendance"></li>
          <li class="chat__example" data-i18n="chat.example.marks"></li>
        </ul>
      </div>

      <!-- Messages are appended here by teacher.js, through textContent only. -->
      <div class="chat__messages" id="chat-messages"></div>
    </div>

    <p class="chat__status" id="chat-status" role="status"></p>

    <form class="composer" id="chat-form">
      <label class="vh" for="chat-input" data-i18n="chat.input_label"></label>
      <!-- maxlength matches the API input limit in design.md §5 (message <= 2000 characters). -->
      <input class="composer__input" id="chat-input" name="message" type="text"
             maxlength="2000" autocomplete="off" enterkeyhint="send"
             data-i18n-placeholder="chat.input_placeholder">

      <div class="composer__row">
        <!-- Present, visibly disabled, and explained: voice notes are M6 work. -->
        <button class="composer__mic" id="chat-mic" type="button" disabled aria-describedby="mic-note">
          <span class="composer__mic-glyph" aria-hidden="true"></span>
          <span data-i18n="chat.mic"></span>
        </button>
        <button class="composer__send" id="chat-send" type="submit" data-i18n="chat.send"></button>
      </div>
    </form>

    <p class="composer__note" id="mic-note" data-i18n="chat.mic_note"></p>
  </section>

  <!-- ---------- fee ledger ---------- -->
  <section class="block" aria-labelledby="ledger-heading">
    <h3 class="block__heading" id="ledger-heading" data-i18n="ledger.heading"></h3>

    <div class="ledger">
      <div class="ledger__head">
        <!-- Month name and totals are generated, so they carry no data-i18n key. -->
        <p class="ledger__month" id="ledger-month"></p>
        <p class="ledger__total">
          <span data-i18n="ledger.total_label"></span>
          <span class="ledger__total-amount" id="ledger-total"></span>
        </p>
      </div>

      <p class="ledger__status" id="ledger-status" role="status"></p>

      <ul class="ledger__list" id="ledger-list" aria-labelledby="ledger-heading"></ul>
    </div>
  </section>

</main>

<footer class="footer">
  <p class="footer__line footer__small" data-i18n="footer.demo_data"></p>
</footer>

</body>
</html>
