# Amplify Hosting response headers. Implements requirement 13.6.
#
# The CSP starts from `default-src 'none'` and opens only what the app actually uses. There is no
# 'unsafe-inline' anywhere, which is why index.html carries no inline <style> or <script>.
#
# TODO after the first deploy — `connect-src` needs THREE origins, and nothing else changes:
#   connect-src 'self'
#     https://<api-id>.execute-api.<region>.amazonaws.com
#     https://panthiya-<account-id>.auth.<region>.amazoncognito.com
#     https://<voice-bucket>.s3.<region>.amazonaws.com;
# All three come out of the stack: `ApiEndpoint`, `HostedUiDomain` and `VoiceBucketName`.
#
# The second is there because the PKCE token exchange is a `fetch` to the hosted UI's
# `/oauth2/token` — miss it and sign-in fails in a way that looks identical to being offline, so
# watch the network tab rather than the page.
#
# The third was added 2026-11-20, and it had been missing from this note since voice landed: the
# microphone PUTs the recording straight to a presigned S3 URL, which is a different origin from
# the API. Miss it and the mic fails with `mic.error` while the console shows a CSP violation —
# a twenty-minute mystery at the wrong hour of the night, and the fix is one word in this file.
#
# `form-action` stays 'none', corrected from an earlier note that said otherwise: there is no
# <form> anywhere, and the trip to the hosted UI is `location.assign`, a top-level navigation,
# which this policy does not restrict. Do not widen anything else.

customHeaders:
  - pattern: '**'
    headers:
      - key: Content-Security-Policy
        value: >-
          default-src 'none';
          script-src 'self';
          style-src 'self';
          img-src 'self' data:;
          font-src 'self';
          connect-src 'self' https://j00w1rv0l0.execute-api.ap-south-1.amazonaws.com https://panthiya-477013660512.auth.ap-south-1.amazoncognito.com https://panthiya-voicebucket-honuqhuglqzj.s3.ap-south-1.amazonaws.com;
          manifest-src 'self';
          base-uri 'none';
          form-action 'none';
          frame-ancestors 'none';
          object-src 'none';
          upgrade-insecure-requests
      - key: Strict-Transport-Security
        value: 'max-age=63072000; includeSubDomains; preload'
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Only the microphone is ever needed, and only for the teacher voice note in M6.
      - key: Permissions-Policy
        value: >-
          microphone=(self), camera=(), geolocation=(), payment=(), usb=(),
          accelerometer=(), gyroscope=(), magnetometer=(), midi=(),
          display-capture=(), fullscreen=(self)
      - key: X-Frame-Options
        value: DENY
      - key: Cross-Origin-Opener-Policy
        value: same-origin
      - key: Cross-Origin-Resource-Policy
        value: same-origin

  # Language packs change with every i18n edit; never let a stale pack stick around.
  - pattern: '/i18n/*.json'
    headers:
      - key: Cache-Control
        value: 'no-cache'
