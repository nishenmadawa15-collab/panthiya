# Amplify Hosting response headers. Implements requirement 13.6.
#
# The CSP starts from `default-src 'none'` and opens only what the app actually uses. There is no
# 'unsafe-inline' anywhere, which is why index.html carries no inline <style> or <script>.
#
# M1 TODO: add the API Gateway origin to connect-src, e.g.
#   connect-src 'self' https://<api-id>.execute-api.<region>.amazonaws.com
# and the Cognito hosted-UI origin to form-action. Do not widen anything else.

customHeaders:
  - pattern: '**'
    headers:
      - key: Content-Security-Policy
        value: >-
          default-src 'none';
          script-src 'self';
          style-src 'self';
          img-src 'self' data:;
          font-src 'self';
          connect-src 'self';
          manifest-src 'self';
          base-uri 'none';
          form-action 'none';
          frame-ancestors 'none';
          object-src 'none';
          upgrade-insecure-requests
      - key: Strict-Transport-Security
        value: 'max-age=63072000; includeSubDomains; preload'
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Only the microphone is ever needed, and only for the teacher voice note in M6.
      - key: Permissions-Policy
        value: >-
          microphone=(self), camera=(), geolocation=(), payment=(), usb=(),
          accelerometer=(), gyroscope=(), magnetometer=(), midi=(),
          display-capture=(), fullscreen=(self)
      - key: X-Frame-Options
        value: DENY
      - key: Cross-Origin-Opener-Policy
        value: same-origin
      - key: Cross-Origin-Resource-Policy
        value: same-origin

  # Language packs change with every i18n edit; never let a stale pack stick around.
  - pattern: '/i18n/*.json'
    headers:
      - key: Cache-Control
        value: 'no-cache'
