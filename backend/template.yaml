AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Panthiya backend — 8 DynamoDB tables, 8 Lambdas, one HTTP API behind a Cognito
  JWT authorizer, an S3 bucket for voice notes, and one account-wide cost budget.
  Implements design.md §4 (data model), §3.3 (per-Lambda IAM), §5 (API surface)
  and requirements 13.1–13.3. Everything scales to zero; nothing here is billed
  hourly (req 13.2). The Bedrock agent and guardrail are created by hand
  (M1 task 1.11) and passed in as parameters.

# ---------------------------------------------------------------------------
# Parameters — no account IDs, no secrets. Replace the Bedrock defaults after
# task 1.11 creates the agent, e.g.
#   sam deploy --parameter-overrides BedrockAgentId=ABC1234567 ...
# ---------------------------------------------------------------------------
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Stage name and suffix used in resource names.

  SiteOrigin:
    Type: String
    Default: http://localhost:8080
    Description: >-
      Origin the front-end is served from, with no trailing slash. Every hosted-UI callback and
      logout URL is built from it, and Cognito matches them byte for byte. The default is a local
      static server, because the Amplify origin does not exist until Amplify is connected — which
      happens AFTER the first deploy. So the live sign-in needs a second deploy with this set, e.g.
      sam deploy --parameter-overrides SiteOrigin=https://main.d1234abcd.amplifyapp.com

  BedrockAgentId:
    Type: String
    Default: REPLACEME00
    # An id, never a pattern — see the note on HarnessId below. This one is interpolated into
    # `agent-alias/${BedrockAgentId}/${BedrockAgentAliasId}`, so a `*` here widens that grant to
    # every agent alias in the account, and a `/` writes a second segment into the ARN.
    AllowedPattern: "^[A-Za-z0-9_-]+$"
    Description: Bedrock agent id from M1 task 1.11 (10-char id, e.g. ABC1234567).

  BedrockAgentAliasId:
    Type: String
    Default: TSTALIASID
    AllowedPattern: "^[A-Za-z0-9_-]+$"
    Description: Agent alias id. TSTALIASID is the working draft alias Bedrock creates for you.

  HarnessId:
    Type: String
    Default: REPLACEME00
    # An id, never a pattern. This value is interpolated straight into the one `InvokeHarness`
    # Resource below, so `HarnessId=*` would turn "one action, one harness" into every harness in
    # the account — including one somebody created with `allowedTools: ["*"]`, which is a shell and
    # filesystem write. It also undoes the id/ARN agreement this template rests on ("refused by IAM
    # rather than invoked"): a wildcard grant refuses nothing. The pattern is deliberately loose
    # about the real id shape, which is UNVERIFIED, and strict about the two characters that widen
    # an ARN: `*` and `/`. chat/index.mjs checks the agreement itself for the same reason.
    AllowedPattern: "^[A-Za-z0-9_-]+$"
    Description: >-
      AgentCore harness id (docs/AGENTCORE-PLAN.md Track A), from the `create-harness` call a human
      runs by hand — the harness is NOT a resource of this template, because the execution role has
      to exist before the call and the call is the thing that spends money. While this is the
      placeholder, chat/index.mjs selects the Converse fallback; set it and the harness path takes
      over with no code change. It also scopes this stack's one `InvokeHarness` grant.

  HarnessArn:
    Type: String
    Default: ""
    Description: >-
      The same harness, as the ARN `InvokeHarness` is addressed to
      (arn:aws:bedrock-agentcore:REGION:ACCOUNT:harness/ID). Empty by default because it carries an
      account id and this repo is public. An ARN that disagrees with HarnessId above is refused by
      IAM rather than invoked, since the grant is built from the id.

  GuardrailId:
    Type: String
    Default: ""
    Description: Bedrock guardrail id (design §6.3). Empty until the guardrail exists.

  GuardrailVersion:
    Type: String
    Default: DRAFT
    Description: Guardrail version to apply.

  ModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Model the agent uses. Nova Lite until the day-1 Sinhala test says otherwise (design §2.1).

  BudgetAlertEmail:
    Type: String
    Description: >-
      Where the cost-budget alert emails go (design §10). **No default on purpose**: the owner's
      address must never be committed to a public repo, so `sam deploy --guided` has to ask for it
      and stores it in `samconfig.toml`, which `.gitignore` excludes. It is the only place in this
      template that takes a personal identifier.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Must be one email address, e.g. you@example.com.

  BudgetLimitUsd:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 15
    Description: >-
      Monthly account-wide cost budget in USD. 10 is the figure design §10 names; MaxValue is the
      US$15 project target, so CloudFormation itself refuses a budget set above the target.

# ---------------------------------------------------------------------------
# Globals — shared Lambda config. Table names reach the code only as
# environment variables; nothing is hardcoded in a handler.
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        CLASSES_TABLE: !Ref ClassesTable
        STUDENTS_TABLE: !Ref StudentsTable
        ATTENDANCE_TABLE: !Ref AttendanceTable
        FEES_TABLE: !Ref FeesTable
        MARKS_TABLE: !Ref MarksTable
        MESSAGES_TABLE: !Ref MessagesTable
        AUDIT_LOG_TABLE: !Ref AuditLogTable
        REDTEAM_RUNS_TABLE: !Ref RedteamRunsTable
        VOICE_BUCKET: !Ref VoiceBucket
        MODEL_ID: !Ref ModelId

# Packaging note: CodeUri is the backend root, not each function's own directory, because every
# handler imports the shared modules in backend/lib/. With a per-function CodeUri those imports
# resolve fine on a laptop and then fail with MODULE_NOT_FOUND on the first real invocation, since
# SAM would only ship that one directory. The bundle is a few hundred KB of plain JS with no
# dependencies, so shipping all of backend/ to every function costs nothing worth optimising.
# tests/unit/packaging.test.mjs checks that every relative import stays inside the packaged root.
Resources:
  # =========================================================================
  # 1. DynamoDB — design §4. On-demand billing, SSE on, point-in-time
  #    recovery off (demo data only). GSI sort keys that hold a composite
  #    value are named after the value, e.g. dateStudentId = "date#studentId".
  # =========================================================================

  ClassesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-classes"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: classId
          AttributeType: S
        - AttributeName: teacherId
          AttributeType: S
      KeySchema:
        - AttributeName: classId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byTeacher
          KeySchema:
            - AttributeName: teacherId # Cognito sub
              KeyType: HASH
            - AttributeName: classId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  StudentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-students"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: studentId
          AttributeType: S
        - AttributeName: classId
          AttributeType: S
        - AttributeName: displayName
          AttributeType: S
        - AttributeName: parentSub
          AttributeType: S
      KeySchema:
        - AttributeName: studentId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byClass
          KeySchema:
            - AttributeName: classId
              KeyType: HASH
            - AttributeName: displayName
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: byParent
          KeySchema:
            - AttributeName: parentSub
              KeyType: HASH
            - AttributeName: studentId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AttendanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-attendance"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: studentId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
        - AttributeName: classId
          AttributeType: S
        - AttributeName: dateStudentId
          AttributeType: S
      KeySchema:
        - AttributeName: studentId
          KeyType: HASH
        - AttributeName: date # YYYY-MM-DD
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byClass
          KeySchema:
            - AttributeName: classId
              KeyType: HASH
            - AttributeName: dateStudentId # "date#studentId"
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  FeesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-fees"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: studentId
          AttributeType: S
        - AttributeName: period
          AttributeType: S
        - AttributeName: classId
          AttributeType: S
      KeySchema:
        - AttributeName: studentId
          KeyType: HASH
        - AttributeName: period # YYYY-MM
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byClass
          KeySchema:
            - AttributeName: classId
              KeyType: HASH
            - AttributeName: period
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  MarksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-marks"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: studentId
          AttributeType: S
        - AttributeName: assessmentId
          AttributeType: S
        - AttributeName: classId
          AttributeType: S
      KeySchema:
        - AttributeName: studentId
          KeyType: HASH
        - AttributeName: assessmentId # "date#slug"
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byClass
          KeySchema:
            - AttributeName: classId
              KeyType: HASH
            - AttributeName: assessmentId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-messages"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: messageId
          AttributeType: S
        - AttributeName: parentSub
          AttributeType: S
        - AttributeName: teacherId
          AttributeType: S
        - AttributeName: statusCreatedAt
          AttributeType: S
      KeySchema:
        - AttributeName: messageId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byParent
          KeySchema:
            - AttributeName: parentSub
              KeyType: HASH
            - AttributeName: statusCreatedAt # "status#createdAt"
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: byTeacher
          KeySchema:
            - AttributeName: teacherId
              KeyType: HASH
            - AttributeName: statusCreatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Append-only (req 10.4). No GSI, and no Lambda gets UpdateItem or
  # DeleteItem on this table anywhere in the template.
  AuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-audit-log"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: classId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: classId
          KeyType: HASH
        # Corrected 2026-11-20: this declared `tsUlid` while backend/lib/audit.mjs writes `sk`
        # (and `backend/functions/read/handlers.mjs` queries it). A PutItem missing the range key
        # is rejected -- so in a deployed stack EVERY audit write would have failed, AFTER the data
        # row it describes had already persisted: precisely the untraceable write requirement 10.2
        # exists to prevent. Invisible offline because all three test fixtures declare
        # ['classId','sk'] and only the seed wrote `tsUlid`. The name is `sk` rather than `tsUlid`
        # because audit.mjs builds `${ts}#${randomUUID()}` -- a UUID, never a ULID.
        - AttributeName: sk # "<ISO timestamp>#<uuid>"
          KeyType: RANGE

  # The only table with a TTL: red-team runs self-delete after 30 days,
  # which is also a cost guard (design §10).
  RedteamRunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-redteam-runs"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: runId
          AttributeType: S
        - AttributeName: caseId
          AttributeType: S
        - AttributeName: teacherId
          AttributeType: S
      KeySchema:
        - AttributeName: runId
          KeyType: HASH
        - AttributeName: caseId # "_meta" row holds the run totals
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byTeacher
          KeySchema:
            - AttributeName: teacherId
              KeyType: HASH
            - AttributeName: runId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # =========================================================================
  # 2. S3 — voice notes. No public access at all, SSE on, and objects are
  #    deleted after one day (design §10 cost guard).
  # =========================================================================
  VoiceBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-voice-notes-after-1-day
            Status: Enabled
            Prefix: voice/
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      # Needed so the browser can PUT to the presigned URL. The URL itself is
      # the only credential; CORS does not grant access.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 300

  # =========================================================================
  # 3. Cognito — one pool, one browser client (no secret), three groups.
  #    The role comes from the group claim in the ID token and is read
  #    server-side only (req 1.3).
  # =========================================================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true # demo accounts are created by the maintainer
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-web"
      UserPoolId: !Ref UserPool
      GenerateSecret: false # public browser client; a secret could not be kept
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        # ADMIN_USER_PASSWORD_AUTH is how `scripts/demo-users.mjs --tokens` gets an ID
        # token for the red-team CLI. Without it there is no way to get one outside a
        # browser at all: SRP is the only browser flow, USER_PASSWORD_AUTH is
        # deliberately absent, and hand-rolling SRP would be ~200 lines of crypto in a
        # repo with no dependencies. This flow is an *admin* API — it needs IAM
        # credentials and cannot be reached from a browser — so the public client is
        # not weakened by it. Remove it and the terminal half of task 5.7 stops working.
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      # The hosted UI, for task 2.3. `GenerateSecret` stays false above: PKCE needs a public
      # client, and the authorization-code flow with PKCE is the only one enabled — never implicit,
      # which would put a token in a URL fragment and from there into history and logs.
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      # An exact-match allowlist, one entry per page, because the ID token lives in that page's
      # memory and does not survive a navigation — so each page completes its own sign-in. The
      # trailing slash is load-bearing, and the `index.html` form is deliberately NOT listed:
      # `auth.js` strips it so there is exactly one URI per page to match.
      CallbackURLs:
        - !Sub "${SiteOrigin}/teacher/"
        - !Sub "${SiteOrigin}/parent/"
        - !Sub "${SiteOrigin}/student/"
        - !Sub "${SiteOrigin}/redteam/"
      LogoutURLs:
        - !Sub "${SiteOrigin}/teacher/"
        - !Sub "${SiteOrigin}/parent/"
        - !Sub "${SiteOrigin}/student/"
        - !Sub "${SiteOrigin}/redteam/"
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED

  TeacherGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: teacher
      UserPoolId: !Ref UserPool

  ParentGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: parent
      UserPoolId: !Ref UserPool

  StudentGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: student
      UserPoolId: !Ref UserPool

  # The hosted UI has to be hosted somewhere. The prefix is globally unique across the whole of
  # Cognito, so the account id is in it, and it may not contain "aws", "amazon" or "cognito".
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "panthiya-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

  # =========================================================================
  # 4. HTTP API — every route is behind the Cognito JWT authorizer, which
  #    verifies signature, issuer, audience and expiry before our code runs
  #    (req 1.2). Throttling is a cost guard, not a security control.
  # =========================================================================
  PanthiyaApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowOrigins: ["*"] # the app is served from Amplify on another origin
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        MaxAge: 300
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20

  # =========================================================================
  # 5. Lambdas. SAM creates one role per function, so each policy below is
  #    that function's entire reach. Every DynamoDB resource is a literal
  #    table or index ARN — no "*", no AmazonDynamoDBFullAccess (req 13.3).
  # =========================================================================

  # chat — orchestrator. Touches no table: it talks to the agent and then to
  # policy-check, and that is all it is allowed to do.
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: functions/chat/index.handler
      Timeout: 29 # the agent round-trip is the slow part; API Gateway caps at 30
      Environment:
        Variables:
          BEDROCK_AGENT_ID: !Ref BedrockAgentId
          BEDROCK_AGENT_ALIAS_ID: !Ref BedrockAgentAliasId
          # Track A. HARNESS_ID decides the orchestrator (index.mjs `orchestratorFor`); HARNESS_ARN
          # is what the invoke is addressed to. Both, because the IAM below is scoped to an ARN
          # built from the id, so an id/ARN mismatch is AccessDenied rather than a wrong invoke.
          HARNESS_ID: !Ref HarnessId
          HARNESS_ARN: !Ref HarnessArn
          GUARDRAIL_ID: !Ref GuardrailId
          GUARDRAIL_VERSION: !Ref GuardrailVersion
          POLICY_CHECK_FUNCTION: !Ref PolicyCheckFunction
          # Every orchestrator dispatches tool use to the action group that owns it by Lambda
          # invoke, so each group keeps its own IAM role (design §3.3) — the harness hands an
          # inline-function call back to chat/index.mjs, which invokes the same way the Converse
          # loop does. An in-process import would need all three sets of permissions on this one
          # function. Which orchestrator runs is these variables' decision and no code change:
          # HARNESS_ID set picks the harness (the path the challenge rules require,
          # docs/AGENTCORE-PLAN.md), else BEDROCK_AGENT_ID set picks option A, else the loop.
          ACTIONS_TEACHER_FUNCTION: !Ref ActionsTeacherFunction
          ACTIONS_PARENT_FUNCTION: !Ref ActionsParentFunction
          ACTIONS_STUDENT_FUNCTION: !Ref ActionsStudentFunction
          # Rounds of tool use per message, so a looping model is a tunable rather than a redeploy.
          # The code default is MAX_TOOL_TURNS = 4 in orchestrate.mjs; drop it if the live round
          # trip is slow, because five model calls have to fit in this function's 29 seconds.
          MAX_TOOL_TURNS: "4"
      Policies:
        - Statement:
            - Sid: InvokeTheOneAgentAlias
              Effect: Allow
              Action: bedrock:InvokeAgent
              Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:agent-alias/${BedrockAgentId}/${BedrockAgentAliasId}"
            # Track A. One action, one harness. The ARN is built from HarnessId rather than taken
            # from HarnessArn because HarnessArn defaults to "" (it carries an account id and this
            # repo is public), and an IAM Resource of "" is a MalformedPolicyDocument at deploy
            # time — the same reason ApplyGuardrail below uses a constructed ARN.
            - Sid: InvokeTheOneHarness
              Effect: Allow
              Action: bedrock-agentcore:InvokeHarness
              Resource: !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:harness/${HarnessId}"
            # DO NOT ADD `bedrock-agentcore:InvokeAgentRuntimeCommand` OR
            #    `bedrock-agentcore:InvokeAgentRuntimeCommandShell` HERE.
            #
            # AWS: "allowedTools scopes LLM tool selection during InvokeHarness only. It does not
            # affect InvokeAgentRuntimeCommand, which is a separate API with its own IAM action that
            # executes commands directly without passing through the LLM. To prevent direct command
            # execution, do not grant bedrock-agentcore:InvokeAgentRuntimeCommand in your IAM
            # policies."
            #
            # Either one executes commands with the model out of the loop entirely, which routes
            # around `allowedTools` in backend/agentcore/harness-config.mjs — the guard that stops a
            # child-safety submission shipping a shell and filesystem write. It is written here
            # because this is the line someone will pattern-match the `bedrock-agentcore:` prefix
            # against in a hurry on deploy evening. tests/unit/chat-loop.test.mjs asserts the
            # absence; backend/agentcore/execution-role-policy.json records the quote.
            #
            # ponytail: `bedrock:InvokeModel` and `bedrock:ApplyGuardrail` below STAY, and
            # docs/AGENTCORE-PLAN.md §10 item 3 ("they move off this role onto the harness execution
            # role") is therefore not followed as written. On the harness path they are indeed dead
            # — the harness makes the model call under its own role — but the same deployment serves
            # option B whenever HarnessId is still the placeholder, and option B's `Converse` call
            # is made by THIS function. Removing them would break the documented fallback the moment
            # the harness is unset. Remove them on the day option B is deleted, not before.
            - Sid: InvokeTheModelForTheToolLoop
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${ModelId}"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}"
            # ponytail: guardrail/* rather than guardrail/${GuardrailId} because GuardrailId
            # defaults to "" until A3 creates it, and an ARN ending in "guardrail/" is a
            # deploy-time failure. Narrow it to the real id once the guardrail exists.
            - Sid: ApplyTheGuardrailOnEveryModelCall
              Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*"
            - Sid: InvokeTheThreeActionGroups
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt ActionsTeacherFunction.Arn
                - !GetAtt ActionsParentFunction.Arn
                - !GetAtt ActionsStudentFunction.Arn
            - Sid: InvokePolicyCheckOnly
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt PolicyCheckFunction.Arn
      Events:
        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref PanthiyaApi
            Method: POST
            Path: /chat

  # actions-teacher — the only writing Lambda. Read/write on the six data
  # tables, and PutItem (never Update, never Delete) on audit_log so the log
  # stays append-only (req 10.4).
  ActionsTeacherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: functions/actions-teacher/index.handler
      Policies:
        - Statement:
            - Sid: TeacherReadWriteOwnDomain
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
              Resource:
                - !GetAtt ClassesTable.Arn
                - !Sub "${ClassesTable.Arn}/index/byTeacher"
                - !GetAtt StudentsTable.Arn
                - !Sub "${StudentsTable.Arn}/index/byClass"
                - !Sub "${StudentsTable.Arn}/index/byParent"
                - !GetAtt AttendanceTable.Arn
                - !Sub "${AttendanceTable.Arn}/index/byClass"
                - !GetAtt FeesTable.Arn
                - !Sub "${FeesTable.Arn}/index/byClass"
                - !GetAtt MarksTable.Arn
                - !Sub "${MarksTable.Arn}/index/byClass"
                - !GetAtt MessagesTable.Arn
                - !Sub "${MessagesTable.Arn}/index/byParent"
                - !Sub "${MessagesTable.Arn}/index/byTeacher"
            - Sid: AuditLogAppendOnly
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AuditLogTable.Arn
      Events:
        # Teacher writes that arrive over HTTP rather than through the agent.
        ApproveDraft:
          Type: HttpApi
          Properties:
            ApiId: !Ref PanthiyaApi
            Method: POST
            Path: /teacher/drafts/{id}/approve
        DeleteStudent:
          Type: HttpApi
          Properties:
            ApiId: !Ref PanthiyaApi
            Method: DELETE
            Path: /teacher/students/{id}

  # actions-parent — read-only, and only the tables a parent answer can be
  # built from. No PutItem anywhere, so a confused agent cannot write.
  ActionsParentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: functions/actions-parent/index.handler
      Policies:
        - Statement:
            - Sid: ParentReadOnly
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt StudentsTable.Arn
                - !Sub "${StudentsTable.Arn}/index/byClass"
                - !Sub "${StudentsTable.Arn}/index/byParent"
                - !GetAtt FeesTable.Arn
                - !Sub "${FeesTable.Arn}/index/byClass"
                - !GetAtt AttendanceTable.Arn
                - !Sub "${AttendanceTable.Arn}/index/byClass"
                - !GetAtt MarksTable.Arn
                - !Sub "${MarksTable.Arn}/index/byClass"
                - !GetAtt MessagesTable.Arn
                - !Sub "${MessagesTable.Arn}/index/byParent"

  # actions-student — deliberately NO Policies block, so its role carries only
  # CloudWatch Logs write. The tutor needs no stored data, so a student data
  # leak is impossible by IAM rather than by prompt (design §1, §3.3).
  # Do not add DynamoDB permissions here.
  ActionsStudentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: functions/actions-student/index.handler

  # policy-check — layer 3. Needs the roster names only, to spot a reply that
  # mentions another student (design §7). Read-only on students, nothing else.
  PolicyCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: functions/policy-check/index.handler
      Timeout: 5 # it runs on every reply; it must be fast or fail closed
      Policies:
        - Statement:
            - Sid: RosterNamesReadOnly
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt StudentsTable.Arn
                - !Sub "${StudentsTable.Arn}/index/byClass"
                - !Sub "${StudentsTable.Arn}/index/byParent"

  # read — inbox, drafts, audit and the single-student export (req 13.8).
  # Read-only everywhere, including audit_log.
  ReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: functions/read/index.handler
      Policies:
        - Statement:
            - Sid: ReadOnlyViews
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
                - dynamodb:Query
              Resource:
                - !GetAtt ClassesTable.Arn
                - !Sub "${ClassesTable.Arn}/index/byTeacher"
                - !GetAtt StudentsTable.Arn
                - !Sub "${StudentsTable.Arn}/index/byClass"
                - !Sub "${StudentsTable.Arn}/index/byParent"
                - !GetAtt FeesTable.Arn
                - !Sub "${FeesTable.Arn}/index/byClass"
                - !GetAtt AttendanceTable.Arn
                - !Sub "${AttendanceTable.Arn}/index/byClass"
                - !GetAtt MarksTable.Arn
                - !Sub "${MarksTable.Arn}/index/byClass"
                - !GetAtt MessagesTable.Arn
                - !Sub "${MessagesTable.Arn}/index/byParent"
                - !Sub "${MessagesTable.Arn}/index/byTeacher"
                - !GetAtt AuditLogTable.Arn
      Events:
        ParentInbox:
          Type: HttpApi
          Properties:
            ApiId: !Ref PanthiyaApi
            Method: GET
            Path: /parent/inbox
        TeacherDrafts:
          Type: HttpApi
          Properties:
            ApiId: !Ref PanthiyaApi
            Method: GET
            Path: /teacher/drafts
        TeacherAudit:
          Type: HttpApi
          Properties:
            ApiId: !Ref PanthiyaApi
            Method: GET
            Path: /teacher/audit
        StudentExport:
          Type: HttpApi
          Properties:
            ApiId: !Ref PanthiyaApi
            Method: GET
            Path: /teacher/students/{id}/export

  # voice — presigns an S3 PUT and starts a Transcribe job. No table access.
  # S3 is scoped to the voice/ prefix; Transcribe to job names we create.
  VoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: functions/voice/index.handler
      Policies:
        - Statement:
            - Sid: VoiceObjectsOnly
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub "${VoiceBucket.Arn}/voice/*"
            - Sid: TranscribeOwnJobs
              Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:GetTranscriptionJob
              Resource: !Sub "arn:${AWS::Partition}:transcribe:${AWS::Region}:${AWS::AccountId}:transcription-job/panthiya-*"
      Events:
        UploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref PanthiyaApi
            Method: POST
            Path: /voice/upload-url
        # Starts the Transcribe job, and polls it. One route for both because a
        # batch job outlives an API Gateway request: a handler that waited would
        # turn a slow success into a timeout the teacher reads as a failure.
        Transcript:
          Type: HttpApi
          Properties:
            ApiId: !Ref PanthiyaApi
            Method: POST
            Path: /voice/transcript

  # redteam — teacher-only runner. Writes its own results table, reads the
  # roster so cases can reference real demo students.
  RedteamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: functions/redteam/index.handler
      Timeout: 29
      Environment:
        Variables:
          BEDROCK_AGENT_ID: !Ref BedrockAgentId
          BEDROCK_AGENT_ALIAS_ID: !Ref BedrockAgentAliasId
          GUARDRAIL_ID: !Ref GuardrailId
          GUARDRAIL_VERSION: !Ref GuardrailVersion
      # NOTE for the maintainer: the IAM table in design §3.3 gives this role no
      # bedrock:InvokeAgent and no lambda:InvokeFunction, so a live run must go
      # through POST /chat with the teacher's own token, not from here. Add the
      # permission here only if you decide the runner should call the agent itself.
      Policies:
        - Statement:
            - Sid: RedteamRunsReadWrite
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:BatchWriteItem
              Resource:
                - !GetAtt RedteamRunsTable.Arn
                - !Sub "${RedteamRunsTable.Arn}/index/byTeacher"
            - Sid: RosterReadOnly
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt StudentsTable.Arn
                - !Sub "${StudentsTable.Arn}/index/byClass"
      Events:
        RunRedteam:
          Type: HttpApi
          Properties:
            ApiId: !Ref PanthiyaApi
            Method: POST
            Path: /redteam/run
        ListRuns:
          Type: HttpApi
          Properties:
            ApiId: !Ref PanthiyaApi
            Method: GET
            Path: /redteam/runs

  # =========================================================================
  # 6. Lets the hand-made Bedrock agent (task 1.11) invoke the three action
  #    group Lambdas — and only that agent.
  # =========================================================================
  BedrockInvokeActionsTeacher:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ActionsTeacherFunction.Arn
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:agent/${BedrockAgentId}"

  BedrockInvokeActionsParent:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ActionsParentFunction.Arn
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:agent/${BedrockAgentId}"

  BedrockInvokeActionsStudent:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ActionsStudentFunction.Arn
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:agent/${BedrockAgentId}"

  # =========================================================================
  # 7. The cost guard design §10 recorded as missing. It is here rather than a
  #    console step because a budget created by `sam deploy` exists *before*
  #    the first model call, and an alert added afterwards says nothing about
  #    spend that has already happened. A budget with no Budgets Action is
  #    free of charge, so the guard itself cannot eat the budget it guards.
  #
  #    Shape checked against the CloudFormation reference for
  #    AWS::Budgets::Budget (2026-11-19): `Budget` is the only required
  #    top-level property; `BudgetType` and `TimeUnit` are required inside it;
  #    `BudgetLimit` is required for a COST budget; `CostFilters` is optional.
  #
  #    DEPLOY NOTE: Budgets is billing-scoped, so the deploying identity needs
  #    `budgets:ModifyBudget` and `budgets:ViewBudget` (older account-level
  #    policies also gate this behind `aws-portal:ModifyBilling`). If the first
  #    `sam deploy` rolls back with AccessDenied on one of those, grant them to
  #    `panthiya-dev` and deploy again — do not delete this resource, because
  #    then there is no alert at all. Nothing else in the stack needs billing
  #    permissions.
  # =========================================================================
  SpendBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-cost"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
        # No CostFilters on purpose: unfiltered means the whole account. The Bedrock agent, the
        # guardrail and Amplify Hosting are all created outside this stack, so a budget filtered to
        # this stack's own services would miss most of what can actually overspend.
      NotificationsWithSubscribers:
        # ponytail: MONTHLY protects a monthly *rate*, not the US$15 project total — three calendar
        # months of a $10 budget is $30 before the last alert fires. The 50% rung is what makes it
        # useful anyway: the first email lands at $5 of a $15 project, which is early enough to act
        # on. Upgrade path if that is not enough: a second budget with TimeUnit ANNUALLY, or
        # Budgets Actions to detach the Bedrock permission automatically.
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            ThresholdType: PERCENTAGE
            Threshold: 50
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            ThresholdType: PERCENTAGE
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        # Forecasted, so the warning can arrive before the money is gone rather than after.
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            ThresholdType: PERCENTAGE
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

Outputs:
  ApiEndpoint:
    Description: Base URL for every route. Put this in the front-end config and in the CSP connect-src.
    Value: !Sub "https://${PanthiyaApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  UserPoolId:
    Description: Cognito user pool id.
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito app client id (also the JWT audience).
    Value: !Ref UserPoolClient

  HostedUiDomain:
    Description: Cognito hosted-UI domain. Paste into CONFIG.domain in frontend/assets/auth.js.
    Value: !Sub "${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"

  VoiceBucketName:
    Description: S3 bucket for voice notes; objects expire after 1 day.
    Value: !Ref VoiceBucket

  ClassesTableName:
    Value: !Ref ClassesTable

  StudentsTableName:
    Value: !Ref StudentsTable

  AttendanceTableName:
    Value: !Ref AttendanceTable

  FeesTableName:
    Value: !Ref FeesTable

  MarksTableName:
    Value: !Ref MarksTable

  MessagesTableName:
    Value: !Ref MessagesTable

  AuditLogTableName:
    Value: !Ref AuditLogTable

  RedteamRunsTableName:
    Value: !Ref RedteamRunsTable
